# Netlify: Next.js is detected automatically (OpenNext adapter). Runtime settings live in the site's environment variables.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Image generation runs in netlify/functions/generation-background.mts (background function: up to 15 min).
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]
